<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Compass / Draft Ruler Background Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- Hard Hat / Engineer Symbol -->
  <g transform="translate(106, 120)">
    <!-- Helmet Dome -->
    <path d="M 150 40 C 80 40 30 90 20 150 L 280 150 C 270 90 220 40 150 40 Z" fill="url(#goldGrad)" />
    <!-- Helmet Ridge -->
    <path d="M 135 30 L 165 30 L 165 145 L 135 145 Z" fill="#FDE047" opacity="0.9"/>
    <!-- Helmet Brim -->
    <path d="M 0 150 C 0 145 10 140 30 140 L 270 140 C 290 140 300 145 300 150 C 300 165 260 175 150 175 C 40 175 0 165 0 150 Z" fill="#D97706" />
    <ellipse cx="150" cy="150" rx="140" ry="12" fill="#FBBF24" />
  </g>

  <!-- Platform Monogram Text: EO (Engineering Officer) -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ENGINEERING
  </text>
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#38BDF8" text-anchor="middle" letter-spacing="6">
    OFFICER
  </text>
</svg>
