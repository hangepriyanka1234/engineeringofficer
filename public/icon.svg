<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0245A3"/>
      <stop offset="25%" stop-color="#072B6B"/>
      <stop offset="70%" stop-color="#05193B"/>
      <stop offset="100%" stop-color="#020E24"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Yellow Hard Hat Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEA79"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Chrome E Letter Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E2E8F0"/>
      <stop offset="75%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Road Highway Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Water Cascade Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Pill Badge Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.9"/>
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.3"/>

  <!-- Blueprint Drafting Compass (Top-Left Background) -->
  <g opacity="0.35" stroke="#38BDF8" stroke-width="3" fill="none">
    <circle cx="80" cy="95" r="8"/>
    <line x1="80" y1="103" x2="60" y2="160"/>
    <line x1="80" y1="103" x2="100" y2="160"/>
    <line x1="68" y1="135" x2="92" y2="135"/>
    <circle cx="80" cy="140" r="45" stroke-dasharray="4 4" stroke-width="1.5"/>
  </g>

  <!-- Construction Tower Crane (Top-Right Background) -->
  <g opacity="0.4" stroke="#93C5FD" stroke-width="2.5" fill="none">
    <line x1="390" y1="75" x2="390" y2="175"/>
    <line x1="390" y1="75" x2="435" y2="75"/>
    <line x1="390" y1="75" x2="340" y2="75"/>
    <line x1="390" y1="55" x2="390" y2="75"/>
    <line x1="390" y1="55" x2="435" y2="75"/>
    <line x1="390" y1="55" x2="340" y2="75"/>
    <line x1="420" y1="75" x2="420" y2="115"/>
    <rect x="415" y="115" width="10" height="8" fill="#FBBF24" stroke="none"/>
  </g>

  <!-- Elevated Flyover / Bridge Pillars (Left) -->
  <g opacity="0.8">
    <path d="M 30 220 Q 90 180 150 160 L 150 178 Q 90 198 30 240 Z" fill="#93C5FD"/>
    <rect x="55" y="225" width="12" height="45" fill="#E2E8F0"/>
    <rect x="95" y="200" width="12" height="70" fill="#E2E8F0"/>
    <rect x="135" y="172" width="12" height="98" fill="#E2E8F0"/>
  </g>

  <!-- Water Dam Reservoir Spillway (Right) -->
  <g opacity="0.9">
    <!-- Dam Wall -->
    <path d="M 390 180 L 485 188 L 480 260 L 385 250 Z" fill="#CBD5E1"/>
    <!-- Spillway Pillars -->
    <rect x="405" y="182" width="8" height="50" fill="#94A3B8"/>
    <rect x="430" y="184" width="8" height="50" fill="#94A3B8"/>
    <rect x="455" y="186" width="8" height="50" fill="#94A3B8"/>
    <!-- Flowing Water Waterfalls -->
    <path d="M 405 230 C 405 250 415 270 410 280 L 420 280 C 425 270 415 250 415 230 Z" fill="url(#waterGrad)"/>
    <path d="M 430 230 C 430 250 440 270 435 280 L 445 280 C 450 270 440 250 440 230 Z" fill="url(#waterGrad)"/>
    <path d="M 455 230 C 455 250 465 270 460 280 L 470 280 C 475 270 465 250 465 230 Z" fill="url(#waterGrad)"/>
    <!-- River Waves -->
    <path d="M 380 270 Q 400 260 420 270 T 460 270 T 495 275" stroke="#38BDF8" stroke-width="4" fill="none"/>
    <path d="M 385 280 Q 405 270 425 280 T 465 280 T 495 285" stroke="#67E8F9" stroke-width="3" fill="none"/>
  </g>

  <!-- Central Gear Cog (Engineering Symbol) -->
  <g transform="translate(290, 205)">
    <circle cx="0" cy="0" r="78" fill="#0B1E38" stroke="#E2E8F0" stroke-width="8"/>
    <!-- Gear Teeth -->
    <path d="M -12 -84 L 12 -84 L 10 -76 L -10 -76 Z" fill="#E2E8F0"/>
    <path d="M -12 76 L 12 76 L 10 84 L -10 84 Z" fill="#E2E8F0"/>
    <path d="M -84 -12 L -84 12 L -76 10 L -76 -10 Z" fill="#E2E8F0"/>
    <path d="M 76 -12 L 76 12 L 84 10 L 84 -10 Z" fill="#E2E8F0"/>
    <path d="M -60 -60 L -43 -43 L -49 -37 L -66 -54 Z" fill="#E2E8F0"/>
    <path d="M 43 43 L 60 60 L 54 66 L 37 49 Z" fill="#E2E8F0"/>
    <path d="M 43 -43 L 60 -60 L 66 -54 L 49 -37 Z" fill="#E2E8F0"/>
    <path d="M -43 43 L -60 60 L -54 66 L -37 49 Z" fill="#E2E8F0"/>
    <!-- City Skyline Inside Gear -->
    <rect x="-35" y="-55" width="16" height="50" fill="#93C5FD" opacity="0.6"/>
    <rect x="-15" y="-70" width="22" height="65" fill="#BFDBFE" opacity="0.9"/>
    <rect x="12" y="-45" width="18" height="40" fill="#60A5FA" opacity="0.7"/>
    <!-- Cable Bridge Struts -->
    <line x1="-30" y1="-20" x2="30" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="-20" y1="-20" x2="30" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <line x1="-10" y1="-20" x2="30" y2="0" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Curving Asphalt Highway with Yellow Divider Ribbon -->
  <path d="M 210 275 C 260 250 310 220 330 200 L 360 215 C 330 240 270 275 220 295 Z" fill="url(#roadGrad)"/>
  <path d="M 220 285 C 270 258 320 230 345 208" stroke="#FBBF24" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 235 272 C 275 248 315 222 335 205" stroke="#FFFFFF" stroke-dasharray="6 6" stroke-width="2.5" fill="none"/>

  <!-- Giant 3D Letter 'E' Monogram -->
  <g transform="translate(100, 135)">
    <!-- 3D Shadow extrusion -->
    <path d="M 12 18 L 138 18 L 132 46 L 68 46 L 62 76 L 120 76 L 114 104 L 56 104 L 50 134 L 134 134 L 128 162 L -8 162 Z" fill="#0B1E38"/>
    <!-- 3D Blue Side -->
    <path d="M 18 12 L 144 12 L 138 40 L 74 40 L 68 70 L 126 70 L 120 98 L 62 98 L 56 128 L 140 128 L 134 156 L -2 156 Z" fill="#1D4ED8"/>
    <!-- Front Face -->
    <path d="M 24 6 L 150 6 L 144 34 L 80 34 L 74 64 L 132 64 L 126 92 L 68 92 L 62 122 L 146 122 L 140 150 L 4 150 Z" fill="url(#chromeGrad)"/>
  </g>

  <!-- Golden Civil Engineer Hard Hat (On top of letter 'E') -->
  <g transform="translate(120, 82)">
    <!-- Hat Drop Shadow -->
    <ellipse cx="85" cy="68" rx="80" ry="14" fill="#030E1F" opacity="0.6"/>
    <!-- Dome Base -->
    <path d="M 15 54 C 20 22 55 5 95 6 C 135 7 165 25 170 54 Z" fill="url(#helmetGrad)"/>
    <!-- Top Central Ridge -->
    <path d="M 80 7 C 88 5 98 5 106 7 L 108 52 L 78 52 Z" fill="#FEF08A" opacity="0.9"/>
    <!-- Highlight Reflection Curve -->
    <path d="M 45 32 C 60 18 85 14 110 16" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- Helmet Brim / Rim with 3D Depth -->
    <path d="M 0 55 C 5 48 30 45 92 46 C 155 47 182 50 186 56 C 182 66 150 74 92 73 C 35 72 4 64 0 55 Z" fill="#F59E0B"/>
    <path d="M 2 56 C 10 50 35 48 92 49 C 150 50 176 53 183 58 C 176 65 148 71 92 70 C 35 69 9 63 2 56 Z" fill="#FDE047"/>
  </g>

  <!-- Typography: "Engineering" (Bold White 3D) -->
  <text x="256" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="900" font-size="58" fill="#051630" letter-spacing="1">
    Engineering
  </text>
  <text x="256" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" letter-spacing="1">
    Engineering
  </text>

  <!-- Typography: "Officer" (Vivid Amber Gold 3D) -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="900" font-size="64" fill="#78350F" letter-spacing="2">
    Officer
  </text>
  <text x="256" y="438" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#goldTextGrad)" letter-spacing="2">
    Officer
  </text>

  <!-- Gold Flank Lines Beside "Officer" -->
  <line x1="50" y1="418" x2="120" y2="418" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="392" y1="418" x2="462" y2="418" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

  <!-- Blue Glowing Pill Badge: "BY MH" -->
  <g transform="translate(176, 452)">
    <!-- Glow -->
    <rect x="-1" y="-1" width="162" height="42" rx="21" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.8"/>
    <!-- Pill Base -->
    <rect x="0" y="0" width="160" height="40" rx="20" fill="url(#pillGrad)"/>
    <!-- Pill Text -->
    <text x="80" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="3">
      BY MH
    </text>
  </g>
  <line x1="90" y1="472" x2="165" y2="472" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="347" y1="472" x2="422" y2="472" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
