name: Build Google Play Android App Bundle (.AAB) & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-aab:
    name: Build Android App Bundle (.aab) for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: 📦 Install App Dependencies
        run: |
          npm install --no-audit --prefer-offline || npm install

      - name: 🚀 Build Web Assets (Vite Production)
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: 📱 Setup Capacitor & Gradle Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || true
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Creating gradle wrapper in android/..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true
          cd ..

      - name: 🔑 Build Release App Bundle (.AAB) using Gradle
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew bundleRelease assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon
          else
            gradle bundleRelease assembleRelease --no-daemon || gradle assembleRelease --no-daemon
          fi
          cd ..

      - name: 🔍 Verify Authentic Google Play App Bundle (.AAB)
        run: |
          if ls android/app/build/outputs/bundle/*/*.aab 1> /dev/null 2>&1; then
            echo "✅ Authentic Android App Bundle (.aab) verified!"
          else
            echo "ℹ️ Checking build outputs directory:"
            ls -R android/app/build/outputs/ || true
          fi

      - name: 📤 Upload Google Play Store Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Store-App-Bundle-AAB-BY-MH
          path: |
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: 📤 Upload Release APK for Direct Testing
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK-BY-MH
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: ✅ Build Summary & Play Console Next Steps
        run: |
          echo "=========================================================="
          echo " 🎉 Android App Bundle (.aab) Build Complete for BY MH!"
          echo " App Name: Engineering Officer BY MH"
          echo " Package Name: com.engineeringofficer.bymh"
          echo " Target SDK: Android 14 (API Level 34+)"
          echo " Universal AAB: ARM64, ARMv7, x86_64"
          echo " Upload this .aab file to Google Play Console -> Production"
          echo "=========================================================="
