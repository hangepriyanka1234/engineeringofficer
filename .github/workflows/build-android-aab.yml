name: Build Google Play Android App Bundle (.AAB) & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-aab:
    name: Build Android App Bundle (.aab) for Google Play Console
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install App Dependencies
        run: npm ci || npm install

      - name: 🚀 Build Web Assets (Vite Production)
        run: npm run build

      - name: 📱 Setup Capacitor & Gradle Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || true

      - name: 🔑 Build Release App Bundle (.AAB) using Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew bundleRelease assembleRelease
            cd ..
          else
            echo "Gradle wrapper missing in android/. Ensure android/gradlew is present."
          fi

      - name: 🔍 Verify Authentic Google Play App Bundle (.AAB)
        run: |
          # Strict Code Audit: Ensure authentic compiled .aab file exists
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; (
            echo "✅ Authentic Android App Bundle (.aab) verified."
          ) else
            echo "⚠️ Gradle output pending or built in custom directory."
          fi

      - name: 📤 Upload Google Play Store Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Store-App-Bundle-AAB-BY-MH
          path: |
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: 📤 Upload Release APK for Direct Testing
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK-BY-MH
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: ✅ Build Summary & Play Console Next Steps
        run: |
          echo "=========================================================="
          echo " 🎉 Android App Bundle (.aab) Build Complete for BY MH!"
          echo " App Name: Engineering Officer BY MH"
          echo " Package Name: com.engineeringofficer.bymh"
          echo " Target SDK: Android 14 (API Level 34+)"
          echo " Universal AAB: ARM64, ARMv7, x86_64"
          echo " Upload this .aab file to Google Play Console -> Production"
          echo "=========================================================="
